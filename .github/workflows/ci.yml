name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the command line
        run: |
          pip install .
          rchan --version
          rchan lint --dir examples/digest-channel
      - name: A fresh channel conforms
        run: |
          mkdir fresh && cd fresh
          rchan init
          rchan init
          rchan lint
